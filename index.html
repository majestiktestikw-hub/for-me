<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X Follower Tracker</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --text: #e7e9ea;
      --muted: #8b98a5;
      --accent: #1d9bf0;
      --green: #00ba7c;
      --red: #f4212e;
      --border: #2f3336;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px;
      min-height: 100vh;
    }
    .container { max-width: 1300px; margin: 0 auto; }
    h1 { font-size: 1.9rem; margin-bottom: 6px; }
    .subtitle { color: var(--muted); margin-bottom: 28px; font-size: 0.95rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
      margin-bottom: 40px;
    }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 18px 20px;
      border: 1px solid var(--border);
    }
    .handle {
      font-weight: 700;
      font-size: 1.15rem;
      margin-bottom: 2px;
    }
    .handle a { color: var(--accent); text-decoration: none; }
    .handle a:hover { text-decoration: underline; }
    .count {
      font-size: 1.9rem;
      font-weight: 800;
      margin: 8px 0 12px;
    }
    .deltas {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .delta {
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      padding: 7px 10px;
    }
    .delta .label { color: var(--muted); font-size: 0.72rem; display: block; }
    .delta .value { font-weight: 700; font-size: 1rem; }
    .positive { color: var(--green); }
    .negative { color: var(--red); }
    .zero { color: var(--muted); }
    .notes {
      width: 100%;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 10px;
      font-size: 0.85rem;
      resize: vertical;
      min-height: 50px;
    }
    .notes:focus { outline: 1px solid var(--accent); }
    .status { margin-top: 20px; font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <h1>X Follower Tracker</h1>
    <p class="subtitle">Автоматический трекинг · обновление каждые 12 часов · заметки сохраняются в браузере</p>

    <div id="cards" class="grid"></div>
    <p class="status" id="status">Загрузка...</p>
  </div>

  <script>
    const NOTES_KEY = "x_follower_notes_v1";

    function loadNotes() {
      try {
        return JSON.parse(localStorage.getItem(NOTES_KEY) || "{}");
      } catch {
        return {};
      }
    }

    function saveNote(user, text) {
      const notes = loadNotes();
      notes[user] = text;
      localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
    }

    async function loadData() {
      try {
        const [latestRes, historyRes] = await Promise.all([
          fetch("data/latest.json?t=" + Date.now()),
          fetch("data/history.json?t=" + Date.now())
        ]);

        const latest = await latestRes.json();
        const history = await historyRes.json();

        if (!latest.timestamp) {
          document.getElementById("status").textContent = "Данных пока нет.";
          return;
        }

        renderCards(latest, history);
        document.getElementById("status").textContent =
          "Последнее обновление: " + new Date(latest.timestamp).toLocaleString("ru-RU", { timeZone: "UTC" }) + " UTC";
      } catch (e) {
        document.getElementById("status").textContent = "Ошибка загрузки данных";
        console.error(e);
      }
    }

    function findClosest(history, targetTs, hoursBack) {
      const target = new Date(targetTs).getTime() - hoursBack * 3600 * 1000;
      let best = null, bestDiff = Infinity;
      for (const snap of history) {
        const t = new Date(snap.timestamp).getTime();
        const diff = Math.abs(t - target);
        if (diff < bestDiff) {
          bestDiff = diff;
          best = snap;
        }
      }
      if (best && bestDiff < 9 * 3600 * 1000) return best;
      return null;
    }

    function calcDelta(current, past) {
      if (current == null || past == null) return null;
      return current - past;
    }

    function formatDelta(d) {
      if (d === null || d === undefined) return { text: "—", cls: "zero" };
      if (d > 0) return { text: "+" + d.toLocaleString(), cls: "positive" };
      if (d < 0) return { text: d.toLocaleString(), cls: "negative" };
      return { text: "0", cls: "zero" };
    }

    function renderCards(latest, history) {
      const container = document.getElementById("cards");
      container.innerHTML = "";
      const notes = loadNotes();
      const nowTs = latest.timestamp;

      const sorted = Object.keys(latest.accounts || {})
        .map(user => ({ user, count: latest.accounts[user] || 0 }))
        .sort((a, b) => b.count - a.count);

      for (const { user, count } of sorted) {
        const past12 = findClosest(history, nowTs, 12);
        const past24 = findClosest(history, nowTs, 24);
        const past7  = findClosest(history, nowTs, 24 * 7);
        const past30 = findClosest(history, nowTs, 24 * 30);

        const d12 = formatDelta(calcDelta(count, past12?.accounts?.[user]));
        const d24 = formatDelta(calcDelta(count, past24?.accounts?.[user]));
        const d7  = formatDelta(calcDelta(count, past7?.accounts?.[user]));
        const d30 = formatDelta(calcDelta(count, past30?.accounts?.[user]));

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="handle">
            <a href="https://x.com/${user}" target="_blank" rel="noopener">@${user}</a>
          </div>
          <div class="count">${count.toLocaleString()}</div>
          <div class="deltas">
            <div class="delta"><span class="label">12ч</span><span class="value ${d12.cls}">${d12.text}</span></div>
            <div class="delta"><span class="label">24ч</span><span class="value ${d24.cls}">${d24.text}</span></div>
            <div class="delta"><span class="label">7д</span><span class="value ${d7.cls}">${d7.text}</span></div>
            <div class="delta"><span class="label">30д</span><span class="value ${d30.cls}">${d30.text}</span></div>
          </div>
          <textarea class="notes" placeholder="Заметка..." data-user="${user}">${notes[user] || ""}</textarea>
        `;
        container.appendChild(card);
      }

      // Сохранение заметок
      document.querySelectorAll(".notes").forEach(el => {
        el.addEventListener("change", () => {
          saveNote(el.dataset.user, el.value);
        });
        el.addEventListener("blur", () => {
          saveNote(el.dataset.user, el.value);
        });
      });
    }

    loadData();
  </script>
</body>
</html>
