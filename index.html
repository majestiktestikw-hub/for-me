<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X Follower Tracker</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --text: #e7e9ea;
      --muted: #8b98a5;
      --accent: #1d9bf0;
      --green: #00ba7c;
      --red: #f4212e;
      --border: #2f3336;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px;
      min-height: 100vh;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 1.9rem; margin-bottom: 6px; }
    .subtitle { color: var(--muted); margin-bottom: 28px; font-size: 0.95rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
      margin-bottom: 40px;
    }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 20px;
      border: 1px solid var(--border);
      transition: transform 0.15s;
    }
    .card:hover { transform: translateY(-2px); }
    .handle {
      font-weight: 700;
      font-size: 1.2rem;
      margin-bottom: 2px;
    }
    .handle a { color: var(--accent); text-decoration: none; }
    .handle a:hover { text-decoration: underline; }
    .count {
      font-size: 2rem;
      font-weight: 800;
      margin: 10px 0 14px;
    }
    .deltas {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .delta {
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      padding: 8px 10px;
    }
    .delta .label { color: var(--muted); font-size: 0.75rem; display: block; }
    .delta .value { font-weight: 700; font-size: 1.05rem; }
    .positive { color: var(--green); }
    .negative { color: var(--red); }
    .zero { color: var(--muted); }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin-top: 10px;
    }
    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    th { background: #15202b; color: var(--muted); font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    .status { margin-top: 24px; font-size: 0.85rem; color: var(--muted); }
    .section-title { font-size: 1.25rem; margin: 30px 0 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>X Follower Tracker</h1>
    <p class="subtitle">Автоматический трекинг · обновление каждые 12 часов</p>

    <div id="cards" class="grid"></div>

    <h2 class="section-title">История последних снимков</h2>
    <div style="overflow-x:auto;">
      <table id="history-table">
        <thead>
          <tr id="table-header">
            <th>Время (UTC)</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <p class="status" id="status">Загрузка...</p>
  </div>

  <script>
    async function loadData() {
      try {
        const [latestRes, historyRes] = await Promise.all([
          fetch("data/latest.json?t=" + Date.now()),
          fetch("data/history.json?t=" + Date.now())
        ]);

        const latest = await latestRes.json();
        const history = await historyRes.json();

        if (!latest.timestamp) {
          document.getElementById("status").textContent = "Данных пока нет. Запусти workflow.";
          return;
        }

        renderCards(latest, history);
        renderHistory(history);
        document.getElementById("status").textContent =
          "Последнее обновление: " + new Date(latest.timestamp).toLocaleString("ru-RU", { timeZone: "UTC" }) + " UTC";
      } catch (e) {
        document.getElementById("status").textContent = "Ошибка загрузки данных";
        console.error(e);
      }
    }

    function findClosest(history, targetTs, hoursBack) {
      const target = new Date(targetTs).getTime() - hoursBack * 3600 * 1000;
      let best = null;
      let bestDiff = Infinity;
      for (const snap of history) {
        const t = new Date(snap.timestamp).getTime();
        const diff = Math.abs(t - target);
        if (diff < bestDiff) {
          bestDiff = diff;
          best = snap;
        }
      }
      if (best && bestDiff < 8 * 3600 * 1000) return best;
      return null;
    }

    function calcDelta(current, past) {
      if (current == null || past == null) return null;
      return current - past;
    }

    function formatDelta(d) {
      if (d === null || d === undefined) return { text: "—", cls: "zero" };
      if (d > 0) return { text: "+" + d.toLocaleString(), cls: "positive" };
      if (d < 0) return { text: d.toLocaleString(), cls: "negative" };
      return { text: "0", cls: "zero" };
    }

    function renderCards(latest, history) {
      const container = document.getElementById("cards");
      container.innerHTML = "";

      const accounts = Object.keys(latest.accounts || {});
      const nowTs = latest.timestamp;

      // Сортировка от большего к меньшему
      const sorted = accounts
        .map(user => ({ user, count: latest.accounts[user] || 0 }))
        .sort((a, b) => b.count - a.count);

      for (const { user, count } of sorted) {
        const past12 = findClosest(history, nowTs, 12);
        const past24 = findClosest(history, nowTs, 24);
        const past7d = findClosest(history, nowTs, 24 * 7);
        const past30d = findClosest(history, nowTs, 24 * 30);

        const d12 = calcDelta(count, past12?.accounts?.[user]);
        const d24 = calcDelta(count, past24?.accounts?.[user]);
        const d7  = calcDelta(count, past7d?.accounts?.[user]);
        const d30 = calcDelta(count, past30d?.accounts?.[user]);

        const f12 = formatDelta(d12);
        const f24 = formatDelta(d24);
        const f7  = formatDelta(d7);
        const f30 = formatDelta(d30);

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="handle">
            <a href="https://x.com/${user}" target="_blank" rel="noopener">@${user}</a>
          </div>
          <div class="count">${count.toLocaleString()}</div>
          <div class="deltas">
            <div class="delta">
              <span class="label">12 часов</span>
              <span class="value ${f12.cls}">${f12.text}</span>
            </div>
            <div class="delta">
              <span class="label">24 часа</span>
              <span class="value ${f24.cls}">${f24.text}</span>
            </div>
            <div class="delta">
              <span class="label">7 дней</span>
              <span class="value ${f7.cls}">${f7.text}</span>
            </div>
            <div class="delta">
              <span class="label">30 дней</span>
              <span class="value ${f30.cls}">${f30.text}</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      }
    }

    function renderHistory(history) {
      if (!history.length) return;

      const accounts = Object.keys(history[history.length - 1].accounts || {});
      const header = document.getElementById("table-header");
      const body = document.getElementById("table-body");

      // очищаем старые колонки
      while (header.children.length > 1) header.removeChild(header.lastChild);
      body.innerHTML = "";

      for (const user of accounts) {
        const th = document.createElement("th");
        th.textContent = "@" + user;
        header.appendChild(th);
      }

      const recent = history.slice(-20).reverse();
      for (const snap of recent) {
        const tr = document.createElement("tr");
        const timeTd = document.createElement("td");
        timeTd.style.color = "var(--muted)";
        timeTd.textContent = new Date(snap.timestamp).toLocaleString("ru-RU", {
          timeZone: "UTC",
          day: "2-digit", month: "2-digit",
          hour: "2-digit", minute: "2-digit"
        });
        tr.appendChild(timeTd);

        for (const user of accounts) {
          const td = document.createElement("td");
          const val = snap.accounts[user];
          td.textContent = val != null ? val.toLocaleString() : "—";
          tr.appendChild(td);
        }
        body.appendChild(tr);
      }
    }

    loadData();
  </script>
</body>
</html>
